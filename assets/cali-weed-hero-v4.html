images.stems.forEach((stem,j)=>{let q=ease((t-8.65-j*.27)/1.9);if(!q)return;let [px,py]=[[413,688],[449,672],[1054,735]][j],[cx,cy]=[[375,344],[594,424],[1050,533]][j],tx=px+(cx-px)*q,ty=py+(cy-py)*q,sh=.012*Math.sin((t-9.5)*1.7+j*.9)*ease((t-10.8)/1.1);g.save();g.translate(px,py);g.transform(1,0,sh,1,0,0);g.translate(-px,-py);g.save();g.beginPath();g.rect(0,ty+40*q,N,py+65-(ty+40*q));g.clip();stamp(g,stem);g.restore();g.save();g.translate(tx,ty);g.scale(q,q);g.translate(-cx,-cy);stamp(g,images.leaves[j]);g.restore();g.restore()});
g.save();g.beginPath();g.arc(615,566,508,0,Math.PI*2);g.clip();
images.birds.forEach((im,j)=>{let start=10.7+j*.45;if(t<start)return;let dt=Math.max(0,t-start-1),dx=380-((dt*(72-j*12)+380)%1600),dy=Math.sin((t-start)*1.2+j)*13,cy=j?518:410,flap=1+.07*Math.sin(t*4+j);g.save();g.globalAlpha=ease((t-start)/1.1);g.translate(dx,cy+dy);g.scale(1,flap);g.translate(0,-cy);stamp(g,im);g.restore()});g.restore();g.save();g.translate(0,330*smooth((t-14.2)/6));
if(t>=7){stamp(g,images.letters);stamp(g,images.stamp);g.restore();return}
m.clearRect(0,0,N,N);m.globalCompositeOperation='source-over';m.strokeStyle=m.fillStyle='white';m.lineCap=m.lineJoin='round';let cursor=.35;for(let [pts,w,d]of strokes){let p=Math.max(0,Math.min(1,(t-cursor)/d));cursor+=d;if(!p)continue;let a=part(pts,p);m.lineWidth=w;m.beginPath();m.moveTo(...a[0]);a.slice(1).forEach(v=>m.lineTo(...v));m.stroke()}
let cleanup=ease((t-6.65)/.35);if(cleanup){m.globalAlpha=cleanup;m.fillRect(0,0,N,N);m.globalAlpha=1}m.globalCompositeOperation='source-in';stamp(m,images.letters);m.globalCompositeOperation='source-over';g.drawImage(mask,0,0);
if(t>=3.11){let u=(t-3.11)/.35,k=u<1?1+.45*Math.exp(-7*u)*Math.cos(u*Math.PI*3):1;g.save();g.globalAlpha=ease(u/.2);g.translate(640,815);g.scale(k,k);g.translate(-640,-815);stamp(g,images.stamp);g.restore()}g.restore();}
const view=document.querySelector('#hero'),v=view.getContext('2d',{alpha:false}),host=document.querySelector('main'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let vw=1,vh=1,dpr=1,raf=0,completed=false,ready=false,visible=true;
function resize(){let r=host.getBoundingClientRect();vw=r.width;vh=r.height;dpr=Math.min(devicePixelRatio||1,1.5);view.width=Math.round(vw*dpr);view.height=Math.round(vh*dpr);if(ready)draw(current())}
function current(){return paused?offset:offset+(performance.now()-origin)/1000}
function draw(t){drawScene(t);let z=smooth((t-14.2)/6),initial=Math.min(vw*.46,vh*.57),target=Math.hypot(vw,vh)*1.30,size=initial*Math.exp(Math.log(target/initial)*z),cameraY=566+(550-566)*z;v.setTransform(dpr,0,0,dpr,0,0);v.fillStyle='#000';v.fillRect(0,0,vw,vh);let drift=ease((t-20.2)/3),dx=Math.sin(t*.19)*1.2*drift,dy=Math.sin(t*.16)*.7*drift;let ox=vw/2-size*615/N+dx,oy=vh/2-size*cameraY/N+dy;v.save();v.translate(ox,oy);v.scale(size/N,size/N);stamp(v,images.bg);renderCity(v,t);v.restore();v.drawImage(c,ox,oy,size,size);if(t>=20.2&&!completed){completed=true;document.querySelector('#skip').hidden=true;document.querySelector('#restart').hidden=false;host.dispatchEvent(new CustomEvent('cali:intro-complete',{bubbles:true}));try{window.parent.postMessage({type:'cali:intro-complete'},'*')}catch(e){}}}
function tick(){raf=0;if(!ready||paused||!visible||reduce.matches)return;draw(current());raf=requestAnimationFrame(tick)}
function start(){if(!raf&&!paused&&visible&&!reduce.matches)raf=requestAnimationFrame(tick)}
function pause(){offset=current();paused=true;cancelAnimationFrame(raf);raf=0;document.querySelector('#play').textContent='Play';document.querySelector('#play').setAttribute('aria-pressed','true');try{window.parent.postMessage({type:'cali:state',paused:true,completed},'*')}catch(e){}}
function resume(){origin=performance.now();paused=false;document.querySelector('#play').textContent='Pause';document.querySelector('#play').setAttribute('aria-pressed','false');start();try{window.parent.postMessage({type:'cali:state',paused:false,completed},'*')}catch(e){}}
window.logoReady=false;window.drawLogo=t=>{pause();offset=t;draw(t)};
(async()=>{try{images={bg:await load(DATA.bg),city:await load(DATA.city),letters:await load(DATA.letters),stamp:await load(DATA.stamp),stems:await Promise.all(DATA.stems.map(load)),leaves:await Promise.all(DATA.leaves.map(load)),birds:await Promise.all(DATA.birds.map(load))};ready=true;window.logoReady=true;origin=performance.now();resize();if(reduce.matches){offset=22;paused=true;draw(22);document.querySelector('#play').hidden=true}else{draw(0);start()}}catch(e){host.innerHTML='<img src="cali-weed-hochaufloesend.png" alt="Cali Weed Logo" style="width:100%;height:100%;object-fit:contain">';console.error(e)}})();
new ResizeObserver(resize).observe(host);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!paused)offset=current();visible=false;cancelAnimationFrame(raf);raf=0}else{visible=true;origin=performance.now();start()}});
reduce.addEventListener('change',()=>{if(reduce.matches){pause();offset=22;draw(22);document.querySelector('#play').hidden=true}else{document.querySelector('#play').hidden=false;resume()}});
document.querySelector('#skip').onclick=()=>{offset=22;origin=performance.now();draw(22);try{window.parent.postMessage({type:'cali:state',paused,completed:true},'*')}catch(e){}};
document.querySelector('#play').onclick=()=>paused?resume():pause();
document.querySelector('#restart').onclick=()=>{offset=0;origin=performance.now();completed=false;document.querySelector('#skip').hidden=false;document.querySelector('#restart').hidden=true;if(paused&&!reduce.matches)resume();draw(0);try{window.parent.postMessage({type:'cali:state',paused:false,completed:false},'*')}catch(e){}};
window.caliHero={pause,resume,skip:()=>document.querySelector('#skip').click(),restart:()=>document.querySelector('#restart').click()};
window.addEventListener('message',e=>{if(!e.data||!e.data.action)return;if(window.caliHero&&typeof window.caliHero[e.data.action]==='function')window.caliHero[e.data.action]()});
</script></html>
